<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#2196F3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ComfoAir" />
    <title>Wi-Fi STA</title>
    <link rel="icon" type="image/png" href="Zehnder.png">
    <link rel="apple-touch-icon" href="Zehnder.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" type="text/css" href="WifiManager.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="title">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" class="wifi-icon" aria-hidden="true">
                        <path d="M12 18.5c.7 0 1.25.55 1.25 1.25S12.7 21 12 21s-1.25-.55-1.25-1.25S11.3 18.5 12 18.5z" />
                        <path d="M8.5 16a6 6 0 0 1 7 0" />
                        <path d="M6 13a9 9 0 0 1 12 0" />
                        <path d="M3.5 10a12 12 0 0 1 17 0" />
                    </svg>
                </div>
                <div>
                    <h1>Wi-Fi STA</h1>
                    <div class="hint" style="margin:0">Host: <span id="sta-host"></span></div>
                </div>
            </div>
            <div class="actions">
                <a class="gear" href="/settings" title="Einstellungen" aria-label="Einstellungen">⚙️</a>
            </div>
        </div>

        <div class="card">
            <section class="sec">
                <h2>Willkommen</h2>
                <p class="hint">Dies ist die STA-Startseite.</p>
                <div class="row">
                    <label></label>
                    <a class="btn secondary" href="/ComfoAirDriver.html">ComfoAir 350</a>
                </div>
                <div class="row">
                    <label></label>
                    <a class="btn secondary" href="/ComfoAirSettings.html">ComfoAir 350 Settings</a>
                </div>
                <div class="row">
                    <label></label>
                    <a class="btn secondary" href="/MQTTSettings.html">MQTT Settings</a>
                </div>
                <div class="row">
                    <label></label>
                    <a class="btn secondary" href="/log.html">Serial Log</a>
                </div>
            </section>
            <section class="sec">
                <h2>Status</h2>
                <div class="hint">STA-IP: <code id="sta-ip"></code></div>
            </section>
        </div>

        <footer class="copyright">
            © 2026 R.Wisser · <span id="ver-footer"></span>
        </footer>
    </div>

    <script>
        (function () {
            const VERSION = "2.0.3";
            document.getElementById("ver-footer").textContent = "v" + VERSION;
            document.getElementById("sta-host").textContent = location.hostname || "device.local";
            document.getElementById("sta-ip").textContent = location.host || "0.0.0.0";

            let comfoState = null;
            let comfoStateError = null;

            async function pollComfoState() {
                try {
                    const r = await fetch("/api/comfo/state", { cache: "no-store" });
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    comfoState = await r.json();
                    comfoStateError = null;

                    // optional global verfügbar
                    window.comfoState = comfoState;
                } catch (e) {
                    comfoStateError = e.message;
                    window.comfoStateError = comfoStateError;
                }
            }

            pollComfoState();
            setInterval(pollComfoState, 5000);
        })();

        // PWA Service Worker registrieren
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("service-worker.js").catch((err) => {
            console.log("Service Worker Registrierung fehlgeschlagen:", err);
          });
        }
    </script>
</body>
</html>
