template:
  - sensor:
      - name: "ComfoAir Debug Diff"
        unique_id: comfoair_debug_diff
        unit_of_measurement: "K"
        state: >
          {% set abluft = states('sensor.comfoair_t3') | float(0) %}
          {% set comfort = states('sensor.comfoair_comfort_temp') | float(0) %}
          {{ (abluft - comfort) | round(2) }}


      - name: "ComfoAir Diff"
        unique_id: comfoair_diff
        unit_of_measurement: "°C"
        state: >
          {{ (states('sensor.comfoair_t3_2')|float(0) - states('sensor.comfoair_comfort_temp_2')|float(0)) | round(2) }}

      - name: "ComfoAir Debug Modus"
        unique_id: comfoair_debug_modus
        state: >
          {% set abluft = states('sensor.comfoair_t3') | float(0) %}
          {% set zuluft_temp = states('sensor.comfoair_t2') | float(0) %}
          {% set comfort = states('sensor.comfoair_comfort_temp') | float(0) %}
          {% set diff = abluft - comfort %}
          {% set hour = now().hour %}
          {% set nacht_startfenster = hour >= 3 and hour < 6 %}
          {% set nacht_holdfenster = hour >= 3 and hour < 7 %}
          {% set zuluft_ist = states('number.comfoair_manual_analog_supply') | float(0) %}
          {% set abluft_ist = states('number.comfoair_manual_analog_exhaust') | float(0) %}
          {% set nacht_aktiv = zuluft_ist >= 45 and abluft_ist >= 45 %}
          {% set normal_aktiv = zuluft_ist >= 20 and zuluft_ist < 45 and abluft_ist >= 20 and abluft_ist < 45 %}
          {% set nacht_on = diff > 3.0 and nacht_startfenster and zuluft_temp < abluft %}
          {% set nacht_hold = diff > 2.5 and nacht_holdfenster and zuluft_temp < abluft %}
          {% set lueftung_nacht = nacht_on or (nacht_aktiv and nacht_hold) %}
          {% set normal_on = diff > 1.0 %}
          {% set normal_hold = diff > 0.5 %}
          {% set lueftung_normal = (not lueftung_nacht) and (normal_on or (normal_aktiv and normal_hold)) %}
          {% if lueftung_nacht %}
            nacht
          {% elif lueftung_normal %}
            normal
          {% else %}
            aus
          {% endif %}

      - name: "ComfoAir Debug Grund"
        unique_id: comfoair_debug_grund
        state: >
          {% set abluft = states('sensor.comfoair_t3') | float(0) %}
          {% set zuluft_temp = states('sensor.comfoair_t2') | float(0) %}
          {% set comfort = states('sensor.comfoair_comfort_temp') | float(0) %}
          {% set diff = abluft - comfort %}
          {% set hour = now().hour %}
          {% set nacht_startfenster = hour >= 3 and hour < 6 %}
          {% set nacht_holdfenster = hour >= 3 and hour < 7 %}
          {% set zuluft_ist = states('number.comfoair_manual_analog_supply') | float(0) %}
          {% set abluft_ist = states('number.comfoair_manual_analog_exhaust') | float(0) %}
          {% set nacht_aktiv = zuluft_ist >= 45 and abluft_ist >= 45 %}
          {% set normal_aktiv = zuluft_ist >= 20 and zuluft_ist < 45 and abluft_ist >= 20 and abluft_ist < 45 %}
          {% set nacht_on = diff > 3.0 and nacht_startfenster and zuluft_temp < abluft %}
          {% set nacht_hold = diff > 2.5 and nacht_holdfenster and zuluft_temp < abluft %}
          {% set lueftung_nacht = nacht_on or (nacht_aktiv and nacht_hold) %}
          {% set normal_on = diff > 1.0 %}
          {% set normal_hold = diff > 0.5 %}
          {% set lueftung_normal = (not lueftung_nacht) and (normal_on or (normal_aktiv and normal_hold)) %}
          {% if nacht_on %}
            Nachtkuehlung EIN: diff > 3.0, Nachtfenster aktiv, Zuluft unter Abluft
          {% elif nacht_aktiv and nacht_hold %}
            Nachtkuehlung HALTEN: bereits aktiv, diff > 2.5, Zuluft unter Abluft
          {% elif lueftung_normal and normal_on %}
            Normalbetrieb EIN: diff > 1.0
          {% elif lueftung_normal and normal_aktiv and normal_hold %}
            Normalbetrieb HALTEN: bereits aktiv und diff > 0.5
          {% else %}
            Keine Lueftungsanforderung
          {% endif %}

      - name: "ComfoAir Debug Bypass"
        unique_id: comfoair_debug_bypass
        state: >
          {% set abluft = states('sensor.comfoair_t3') | float(0) %}
          {% set comfort = states('sensor.comfoair_comfort_temp') | float(0) %}
          {% set aussen = states('sensor.comfoair_t1') | float(0) %}
          {% set diff = abluft - comfort %}
          {% set bypass_offen = states('select.comfoair_manual_bypass_setpoint') | lower == 'offen' %}
          {% set bypass_on = diff >= 1.0 and aussen + 0.5 < abluft %}
          {% set bypass_hold = diff > 0.5 and aussen + 0.5 < abluft %}
          {% set bypass_anfordern = bypass_on or (bypass_offen and bypass_hold) %}
          {{ 'an' if bypass_anfordern else 'aus' }}

  - binary_sensor:
      - name: "ComfoAir Bypass Aktiv"
        unique_id: comfoair_bypass_aktiv
        state: >
          {% set abluft = states('sensor.comfoair_t3') | float(0) %}
          {% set comfort = states('sensor.comfoair_comfort_temp') | float(0) %}
          {% set aussen = states('sensor.comfoair_t1') | float(0) %}
          {% set diff = abluft - comfort %}
          {% set bypass_offen = states('select.comfoair_manual_bypass_setpoint') | lower == 'offen' %}
          {% set bypass_on = diff >= 1.0 and aussen + 0.5 < abluft %}
          {% set bypass_hold = diff > 0.5 and aussen + 0.5 < abluft %}
          {{ bypass_on or (bypass_offen and bypass_hold) }}          {{ bypass_on or (bypass_offen and bypass_hold) }}